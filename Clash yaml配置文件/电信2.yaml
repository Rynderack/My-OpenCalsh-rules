# 出站策略
######### 锚点 start #######
pr: &pr {type: select, proxies: [🚀 默认, 直连, 🇭🇰 香港, ♻️ 香港自动, 🇹🇼 台湾, ♻️ 台湾自动, 🇯🇵 日本, ♻️ 日本自动, 🇸🇬 新加坡, ♻️ 新加坡自动, 🇺🇲 美国, ♻️ 美国自动, 🌏 其它地区]}
c1: &c1 {type: select, proxies: [直连, 🚀 默认, 🇭🇰 香港, ♻️ 香港自动, 🇹🇼 台湾, ♻️ 台湾自动, 🇯🇵 日本, ♻️ 日本自动, 🇸🇬 新加坡, ♻️ 新加坡自动, 🇺🇲 美国, ♻️ 美国自动, 🌏 其它地区]}
t1: &t1 {type: select, proxies: [🇹🇼 台湾, 🚀 默认, 🇭🇰 香港, ♻️ 香港自动, 🇯🇵 日本, ♻️ 台湾自动, 直连, ♻️ 日本自动, 🇸🇬 新加坡, ♻️ 新加坡自动, 🇺🇲 美国, ♻️ 美国自动, 🌏 其它地区]}
j1: &j1 {type: select, proxies: [🇯🇵 日本, 🚀 默认, 🇭🇰 香港, ♻️ 香港自动, 🇹🇼 台湾, ♻️ 台湾自动, 直连, ♻️ 日本自动, 🇸🇬 新加坡, ♻️ 新加坡自动, 🇺🇲 美国, ♻️ 美国自动, 🌏 其它地区]}
######### 锚点 end #######

proxy-groups:
  - {name: 🚀 默认, type: select, proxies: [🇭🇰 香港, ♻️ 香港自动, 🇹🇼 台湾, ♻️ 台湾自动, 🇯🇵 日本, ♻️ 日本自动, 🇸🇬 新加坡, ♻️ 新加坡自动, 🇺🇲 美国, ♻️ 美国自动, 🌏 其它地区, 直连]}
  - {name: 🇭🇰 香港, type: select, include-all: true, filter: "(?i)🇭🇰|香港|港|hk|hongkong|hong kong|Hong Kong|HongKong|HK"}
  - {name: ♻️ 香港自动, type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?i)🇭🇰|香港|港|hk|hongkong|hong kong|Hong Kong|HongKong|HK"}
  - {name: 🇹🇼 台湾, type: select, include-all: true, filter: "(?i)🇹🇼|🇨🇳|台湾|新北|彰化|TW|Taiwan"}
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?i)🇹🇼|🇨🇳|台湾|新北|彰化|TW|Taiwan" }
  - {name: 🇯🇵 日本, type: select, include-all: true, filter: "(?i)🇯🇵|日本|jp|japan|Japan|JP"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?i)🇯🇵|日本|jp|japan|Japan|JP"}
  - {name: 🇸🇬 新加坡, type: select, include-all: true, filter: "(?i)🇸🇬|新加坡|加坡|狮城|SG|Singapore"}
  - {name: ♻️ 新加坡自动, type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?i)🇸🇬|新加坡|加坡|狮城|SG|Singapore" }
  - {name: 🇺🇲 美国, type: select, include-all: true, filter: "(?i)🇺🇲|美国|us|unitedstates|united states|United States|US|USA|纽约|拉斯维加斯|凤凰城"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 50, interval: 300, filter: "(?i)🇺🇲|美国|us|unitedstates|united states|United States|US|USA|纽约|拉斯维加斯|凤凰城"}
  - {name: 🌏 其它地区, type: select, include-all: true, filter: "^((?!(🇭🇰|香港|港|hk|hongkong|hong kong|Hong Kong|HongKong|HK|🇹🇼|🇨🇳|台湾|新北|彰化|TW|Taiwan|🇯🇵|日本|jp|japan|Japan|JP|🇸🇬|新加坡|加坡|狮城|SG|Singapore|🇺🇲|美国|us|unitedstates|united states|United States|US|USA|纽约|拉斯维加斯|凤凰城)).)*$"}
  # 分隔，下面是策略分组
  - {name: 🏫 国外学术, <<: *c1}
  - {name: 📹 YouTube, <<: *pr}
  - {name: 📢 谷歌FCM,!!merge <<: *pr}
