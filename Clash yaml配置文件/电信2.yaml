  - {name: 🎵 TikTok, <<: *j1}
  - {name: 💬 Telegram, <<: *pr}
  - {name: 📚 多邻国, <<: *c1}
  - {name: 🎥 奈飞, <<: *pr}
  - {name: 🏦 PayPal, <<: *c1}
  - {name: 🎮 Steam,!!merge <<: *pr}
  - {name: 🎮 Xbox,!!merge <<: *c1}
  - {name: 📺 巴哈姆特, type: select, proxies: [♻️ 台湾自动, 🇹🇼 台湾, 🚀 默认, 🎯 直连]}
  - {name: 🍎 苹果, type: select,!!merge <<: *c1}
